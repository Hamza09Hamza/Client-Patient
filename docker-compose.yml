services:
  db:
    image: postgres:16-alpine
    container_name: clinic-patient-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic_dev_password
      POSTGRES_DB: clinic_portal
    ports:
      - "5433:5432"
    volumes:
      - clinic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic_portal"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  clinic_pgdata:
